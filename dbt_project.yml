name: reconciliation
version: "1.0"
config-version: 2

profile: reconciliation

model-paths: ["dbt/models"]
test-paths: ["dbt/tests"]
seed-paths: ["dbt/seeds"]
macro-paths: ["dbt/macros"]
snapshot-paths: ["dbt/snapshots"]
analysis-paths: ["dbt/analyses"]

target-path: "dbt/target"
clean-targets:
  - "dbt/target"
  - "dbt/dbt_packages"

models:
  reconciliation:
    staging:
      +materialized: view
      +schema: silver

    intermediate:
      +materialized: table
      +schema: silver

    marts:
      +materialized: table
      +schema: gold

vars:
  # Single source of truth for the amount-comparison tolerance — see
  # docs/reconciliation_rules.md, "Tolerance, not exactness".
  reconciliation_tolerance: 0.05