[project]
name = "revenue-reconciliation-engine"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that use real external files or infrastructure",
    "azure: tests that call Azure Document Intelligence",
    "excel: tests that use real Excel workbooks",
]
# Default `pytest` runs only the fast, pure-logic tests. Tests marked
# integration/azure/excel need real local data or a live Azure endpoint,
# neither of which exist in CI or on a fresh clone -- opt in explicitly
# with `pytest -m excel`, `-m azure`, etc.
addopts = "-m \"not integration and not azure and not excel\""