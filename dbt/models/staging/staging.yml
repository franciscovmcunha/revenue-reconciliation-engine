version: 2

models:
  - name: stg_pms
    description: >
      PMS bronze rows typed and renamed onto the canonical field set
      (docs/data_dictionary.md). One row per billed transaction.
    columns:
      - name: transaction_ref
        tests: [not_null]
      - name: amount
        tests: [not_null]

  - name: stg_cash_register
    description: >
      Cash register bronze rows typed and renamed onto the canonical field
      set. One row per recorded cash transaction.
    columns:
      - name: amount
        tests: [not_null]

  - name: stg_card_terminal
    description: >
      Card terminal (TPA) bronze rows, extracted via Azure AI Document
      Intelligence (prebuilt-read + regex — see docs/decisions/0002), typed
      and renamed onto the canonical field set.
    columns:
      - name: amount
        tests: [not_null]
      - name: extraction_confidence
        description: >
          Always null for this source — prebuilt-read gives no per-field
          confidence score. Validity here comes from the slip's own
          arithmetic (Pagamento - Devolução = Saldo) in validator.py, not
          from this column. No not_null test on purpose.
